<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Descent into Avernus — Campaign Slideshow</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909}.slideshow{position:relative;width:100%;height:100vh;overflow:hidden}.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease-in-out}.slide.active{opacity:1}@media(prefers-reduced-motion:reduce){.slide{transition:none}}</style></head><body><main class="slideshow" aria-label="Descent into Avernus artwork slideshow"></main><script>
const files=[
'1000050417.webp',
'basilisk_gate_flaming_fist.webp',
'cult_of_the_dead_three_faction.webp',
'elfsong_tavern_interior (1).webp',
'elturel_refugees_faction.webp',
'flaming_fist_faction.webp',
'image.png',
'lower_city_baldurs_gate.webp',
'the_companion_elturel.webp'
];
const root=document.querySelector('.slideshow');
const slides=files.map((name,i)=>{const img=document.createElement('img');img.src=encodeURIComponent(name).replace(/%2F/g,'/');img.alt=`Campaign artwork ${i+1}`;img.className='slide'+(i===0?' active':'');img.loading=i<2?'eager':'lazy';root.appendChild(img);return img});
let current=0;setInterval(()=>{slides[current].classList.remove('active');current=(current+1)%slides.length;slides[current].classList.add('active')},10000);
</script></body></html>
